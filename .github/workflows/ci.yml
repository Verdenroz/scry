name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  soothfast:
    # the bot's own merge must not regenerate again
    if: github.event_name == 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    environment: soothfast-bot
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: soothfast-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sf-cli
        with:
          path: ~/.soothfast-cli
          key: cargo-soothfast-git-c82e5e27be01ce00a886b58b450d26b62aa891cc
      - if: steps.sf-cli.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.soothfast-cli --git https://github.com/Verdenroz/soothfast --rev c82e5e27be01ce00a886b58b450d26b62aa891cc cargo-soothfast
      - run: echo "$HOME/.soothfast-cli/bin" >> "$GITHUB_PATH"
      - uses: Verdenroz/soothfast@c82e5e27be01ce00a886b58b450d26b62aa891cc
        with:
          binary: /home/runner/.soothfast-cli/bin/cargo-soothfast
          changelog-packages: scry-core scry-server
