name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  soothfast:
    # the bot's own merge must not regenerate again
    if: github.event_name == 'pull_request' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    environment: soothfast-bot
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    concurrency:
      group: soothfast-${{ github.ref }}
      cancel-in-progress: true
    env:
      SOOTHFAST_DEBUG_SEED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build cargo-soothfast
        run: cargo install --locked --root ~/.soothfast-cli --git https://github.com/Verdenroz/soothfast --rev 748e8a8ba18f07333b9001c9e1fb66e5c040f7ae cargo-soothfast
      - uses: Verdenroz/soothfast@748e8a8ba18f07333b9001c9e1fb66e5c040f7ae
        with:
          binary: /home/runner/.soothfast-cli/bin/cargo-soothfast
          changelog-packages: scry-core scry-server
