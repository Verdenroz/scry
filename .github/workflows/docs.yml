name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # callgrind fallback for PMU-less runners
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      # install only, pinned to Cargo.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sf-cli
        with:
          path: ~/.soothfast-cli
          key: cargo-soothfast-git-c82e5e27be01ce00a886b58b450d26b62aa891cc
      - if: steps.sf-cli.outputs.cache-hit != 'true'
        run: cargo install --locked --root ~/.soothfast-cli --git https://github.com/Verdenroz/soothfast --rev c82e5e27be01ce00a886b58b450d26b62aa891cc cargo-soothfast
      - run: echo "$HOME/.soothfast-cli/bin" >> "$GITHUB_PATH"
      - uses: Verdenroz/soothfast@c82e5e27be01ce00a886b58b450d26b62aa891cc
        with:
          binary: /home/runner/.soothfast-cli/bin/cargo-soothfast
          gate: "false"
          changelog: "false"
      - run: cargo soothfast measure -p scry-core --save-baseline base
      - run: cargo soothfast docs check
      - run: cargo soothfast docs build --baseline base
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
