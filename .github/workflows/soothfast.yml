name: soothfast

# Written by `cargo soothfast init`; `cargo soothfast init --check` reports drift.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

# Only a pull request's newer push supersedes a run; a push run records the
# reference the next pull request reuses and must finish.
concurrency:
  group: soothfast-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soothfast:
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: Verdenroz/soothfast/.github/workflows/run.yml@7dfdb2b60f403a36a2acace95a4cbe8dbebd8d9e
    with:
      soothfast_ref: "7dfdb2b60f403a36a2acace95a4cbe8dbebd8d9e"
      bot: true
  pages:
    needs: soothfast
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    uses: Verdenroz/soothfast/.github/workflows/pages.yml@7dfdb2b60f403a36a2acace95a4cbe8dbebd8d9e
