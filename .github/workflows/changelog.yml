name: changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: changelog
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # surface diff worktree + previous-tag lookup need history
      - uses: dtolnay/rust-toolchain@stable
      # rustdoc JSON for the API surface diff is nightly-only
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
      # callgrind fallback for PMU-less runners
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - run: cargo install cargo-soothfast --locked
      - run: cargo soothfast measure -p scry-core --save-baseline base
      - name: Regenerate CHANGELOG.md
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          AGAINST=""
          [ -n "$PREV" ] && AGAINST="--against-ref $PREV"
          # shellcheck disable=SC2086 # deliberate flag list
          cargo soothfast report changelog -p scry-core -p scry-server --baseline base $AGAINST
      - name: Commit if changed
        run: |
          git diff --quiet CHANGELOG.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: regenerate CHANGELOG.md"
          git push
