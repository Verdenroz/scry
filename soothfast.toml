[site]
name = "scry"
version = "0.2.0"
repo = "https://github.com/Verdenroz/scry"

# Brand seeds; soothfast derives the full light+dark Material role set.
# Deep violet for the divination theme, teal for secondary states.
[site.theme]
primary = "#6d28d9"
secondary = "#0f766e"

[[site.nav]]
title = "Guide"
pages = ["index.md", "search.md", "sync-protocol.md", "memory.md", "hosting.md"]

[[project]]
dir = "plugin/plugins/scry/hooks"
ecosystem = "python"
bench_cmd = "uv run --with 'pytest<9' --with pytest-benchmark pytest tests/bench_hooks.py --benchmark-only --benchmark-json {out}"
bench_out = "bench.json"
from = "pytest-benchmark"
walltime = "hard"
