# Golden retrieval set for finance-query. Expectations come from the repo's
# README, docs, and source identifiers, never from a ranker's output; a case
# that was chosen by running search would tune the ranker to itself.
# Run: scry eval eval/finance-query.toml --runs 3

[meta]
repo = "github.com/Verdenroz/finance-query"

[[case]]
query = "how do I fetch the current price for a single stock symbol"
expect = ["src/ticker/core.rs:336"]

[[case]]
query = "where are outbound calls throttled so we stay under a vendor's per-second cap"
expect = ["src/rate_limiter.rs:45"]

[[case]]
query = "how is the wait between reconnection attempts grown and randomized"
expect = ["src/backoff.rs"]

[[case]]
query = "what happens when an upstream answers 429 too many requests"
expect = ["src/providers/retry.rs"]

[[case]]
query = "how are bullish and bearish candle formations recognized"
expect = ["src/indicators/patterns.rs:542"]

[[case]]
query = "expected shortfall in the worst tail of the return distribution"
expect = ["src/risk/cvar.rs"]

[[case]]
query = "how does the web service stop one caller from eating everyone's request budget"
expect = ["server/src/rate_limit.rs:205"]

[[case]]
query = "where is the expiry window for stored responses chosen based on whether trading is open"
expect = ["server/src/cache.rs:18"]

[[case]]
query = "how does the API decide which language to translate a response into"
