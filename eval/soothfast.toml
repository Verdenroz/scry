# Golden retrieval set for soothfast. Expectations come from the repo's
# README, docs, and source identifiers, never from a ranker's output; a case
# that was chosen by running search would tune the ranker to itself.
# Run: scry eval eval/soothfast.toml --runs 3

[meta]
repo = "github.com/Verdenroz/soothfast"

[[case]]
query = "how does the tool decide a benchmark got slower and fail the build"
expect = ["cargo-soothfast/src/gate.rs"]

[[case]]
query = "where is the percentage limit widened when the machine is noisy"
expect = ["cargo-soothfast/src/gate.rs:52"]

[[case]]
query = "how are two versions of the code measured back to back in a scratch checkout"
expect = ["cargo-soothfast/src/gate.rs:654", "cargo-soothfast/src/invoke.rs:1028"]

[[case]]
query = "how is whitespace normalized before an item's source is fingerprinted"
expect = ["soothfast-docs/src/comments.rs:10"]

[[case]]
query = "where are the prose markers and code fences located inside a page"
expect = ["soothfast-docs/src/markdown.rs:121"]

[[case]]
query = "how is a stated number checked against the recorded run"
expect = ["soothfast-docs/src/claims.rs:88"]

[[case]]
query = "where is an expression with an operator and a numeric bound turned into a struct"
expect = ["soothfast-docs/src/claims.rs:38"]

[[case]]
query = "how does a fenced example become a real unit test file"
