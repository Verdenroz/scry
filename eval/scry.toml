# Golden retrieval set for scry itself. Expectations come from CLAUDE.md,
# docs/, and source identifiers, never from a ranker's output; a case that
# was chosen by running search would tune the ranker to itself.
# Run: scry eval eval/scry.toml --runs 3

[meta]
repo = "github.com/Verdenroz/scry"

# natural language

[[case]]
query = "where does the server keep the sqlite connection off the async runtime"
expect = ["crates/scry-server/src/store_actor.rs"]

[[case]]
query = "how are memories marked stale when the file they point at changes"
expect = ["crates/scry-core/src/store/memories.rs:175", "crates/scry-core/src/index.rs:101"]

[[case]]
query = "turn a git remote into a stable repository key"
